name: GLaDOS Auto Checkin

on:
  workflow_dispatch:  # 手动触发
    inputs:
      mode:
        description: 运行方式（diagnose 只读检查，不签到、不发验证码、不兑换）
        type: choice
        default: checkin
        options:
          - checkin
          - diagnose
          - checkin-no-exchange
      runner:
        description: GitHub 托管环境（先用 diagnose 比较验证兼容性）
        type: choice
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - windows-latest
      account_limit:
        description: 只测试前 N 个账号（0 表示全部，不删除其他缓存）
        type: number
        default: 0
  schedule:
    - cron: '17 1 * * *'  # 每日 UTC 1:17 签到（北京时间 9:17）
    - cron: '0 0 1 * *'   # 每月 1 号保活空提交

jobs:
  checkin:
    name: GLaDOS 签到
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 30
    if: github.event_name != 'schedule' || github.event.schedule != '0 0 1 * *'
    concurrency:
      group: glados-checkin
      cancel-in-progress: false

    permissions:
      contents: read

    env:
      GLADOS_EMAILS: ${{ secrets.GLADOS_EMAILS }}
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt --no-cache-dir

      - name: Install Chromium
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            python -m playwright install --with-deps --no-shell chromium
          else
            python -m playwright install --no-shell chromium
          fi

      - name: Run offline tests
        run: python -m unittest discover -s tests -v
        env:
          GLADOS_BROWSER_TESTS: '1'

      # 缓存中只有 Fernet 密文，解密密钥仅在签到步骤通过 Secrets 提供。
      - name: Restore encrypted cookies
        if: env.GLADOS_EMAILS != ''
        uses: actions/cache/restore@v4
        with:
          path: .glados/cookies.enc
          enableCrossOsArchive: true
          key: glados-cookies-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            glados-cookies-v1-${{ github.ref_name }}-
            glados-cookies-v1-main-

      - name: Run checkin
        shell: bash
        run: |
          display=()
          if [ "$RUNNER_OS" = "Linux" ]; then
            google-chrome --version
            display=(xvfb-run -a)
          fi
          case "$RUN_MODE" in
            diagnose) "${display[@]}" python checkin.py --check-challenge --account-limit "$ACCOUNT_LIMIT" ;;
            checkin-no-exchange) "${display[@]}" python checkin.py --no-exchange --account-limit "$ACCOUNT_LIMIT" ;;
            checkin) "${display[@]}" python checkin.py --account-limit "$ACCOUNT_LIMIT" ;;
            *) echo "Unknown run mode"; exit 1 ;;
          esac
        env:
          RUN_MODE: ${{ inputs.mode || 'checkin' }}
          ACCOUNT_LIMIT: ${{ inputs.account_limit || '0' }}
          GLADOS_BROWSER_HEADLESS: 'false'
          GLADOS_BROWSER_CHANNEL: 'chrome'
          GLADOS_BROWSER_LAUNCH: 'native'
          GLADOS_DIAGNOSTIC_SCREENSHOTS: ${{ inputs.mode == 'diagnose' && 'true' || 'false' }}
          GLADOS_BROWSER_TIMEOUT: ${{ vars.GLADOS_BROWSER_TIMEOUT || '120' }}
          COOKIES: ${{ secrets.COOKIES || vars.COOKIES }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          COOKIE_STORE_KEY: ${{ secrets.COOKIE_STORE_KEY }}
          GMAIL_FROM: ${{ secrets.GMAIL_FROM }}
          GMAIL_WAIT_SECONDS: ${{ vars.GMAIL_WAIT_SECONDS || '120' }}
          SENDKEY: ${{ secrets.SENDKEY }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          WECOM_BOT_WEBHOOK: ${{ secrets.WECOM_BOT_WEBHOOK }}
          YUNHU_TOKEN: ${{ secrets.YUNHU_TOKEN }}
          YUNHU_RECV_ID: ${{ secrets.YUNHU_RECV_ID }}
          YUNHU_RECV_TYPE: ${{ secrets.YUNHU_RECV_TYPE }}
          # #9 积分兑换计划（可选；不配置则默认不兑换，不影响现有签到）
          EXCHANGE_PLAN: ${{ secrets.EXCHANGE_PLAN }}
          GLADOS_EXCHANGE_PLAN: ${{ secrets.GLADOS_EXCHANGE_PLAN }}

      - name: Upload verification widget diagnostics
        if: always() && inputs.mode == 'diagnose'
        uses: actions/upload-artifact@v4
        with:
          name: verification-widget
          path: .glados/diagnostics/turnstile-*.png
          retention-days: 1
          if-no-files-found: ignore
          include-hidden-files: true

      # 即使某个账号失败，也保留其他账号已恢复的会话。每次使用新 key 保存。
      - name: Save encrypted cookies
        if: always() && inputs.mode != 'diagnose' && env.GLADOS_EMAILS != '' && hashFiles('.glados/cookies.enc') != ''
        uses: actions/cache/save@v4
        with:
          path: .glados/cookies.enc
          enableCrossOsArchive: true
          key: glados-cookies-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

  keepalive:
    name: 每月空提交保活
    if: github.event_name == 'schedule' && github.event.schedule == '0 0 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: glados-keepalive
      cancel-in-progress: false

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 创建空提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive to prevent workflow suspension"
          git push
